<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reportes | Sistema de Gestión Curricular</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
  <header class="encabezado" id="encabezado"></header>

  <div class="contenedor">
    <nav class="menu-lateral" id="menu"></nav>

    <main class="contenido">
      <h1>Reportes</h1>
      <p class="texto-ayuda">Cursos por estado, periodo y escuela</p>

      <form id="formReporte" class="card card-body mb-4" novalidate autocomplete="off">
        <h2>Filtros</h2>

        <div class="row g-3">
          <div class="col-md-4">
            <label for="filtroEstadoReporte" class="form-label">Estado</label>
            <select id="filtroEstadoReporte" class="form-select">
              <option value="">Todos</option>
            </select>
          </div>

          <div class="col-md-4">
            <label for="filtroPeriodoReporte" class="form-label">Periodo</label>
            <select id="filtroPeriodoReporte" class="form-select">
              <option value="">Todos</option>
            </select>
          </div>

          <div class="col-md-4">
            <label for="filtroEscuelaReporte" class="form-label">Escuela</label>
            <select id="filtroEscuelaReporte" class="form-select">
              <option value="">Todas</option>
            </select>
          </div>
        </div>

        <div class="d-flex justify-content-end mt-3">
          <button type="button" id="btnRestablecerReporte" class="btn btn-outline-primary">Restablecer filtros</button>
        </div>
      </form>

      <h2>Resumen por estado</h2>
      <div id="resumenReporte" class="row row-cols-2 row-cols-md-3 row-cols-xl-5 g-3 mb-4"></div>

      <h2>Cursos</h2>
      <p id="totalReporte" class="texto-ayuda" role="status" aria-live="polite"></p>

      <div id="contenedorReporte" class="table-responsive">
        <table class="table table-hover align-middle">
          <thead>
            <tr>
              <th scope="col">Código</th>
              <th scope="col">Nombre</th>
              <th scope="col">Escuela</th>
              <th scope="col">Periodo</th>
              <th scope="col">Estado</th>
              <th scope="col">Última modificación</th>
            </tr>
          </thead>
          <tbody id="tablaReporte"></tbody>
        </table>
      </div>

      <p id="sinReporte" class="texto-ayuda oculto">Todavía no hay cursos registrados.</p>
    </main>
  </div>

  <footer class="pie-pagina" id="piePagina"></footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
  <script src="../js/almacenamiento.js"></script>
  <script src="../js/componentes.js"></script>
  <script src="../js/menu.js"></script>
  <script src="../js/reportes.js"></script>
</body>
</html>
