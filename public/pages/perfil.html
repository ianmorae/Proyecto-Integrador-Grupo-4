
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi perfil | Sistema de Gestión Curricular</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
  <header class="encabezado" id="encabezado"></header>

  <div class="contenedor">
    <nav class="menu-lateral" id="menu"></nav>

    <main class="contenido">
      <h1>Mi perfil</h1>

      <div class="row g-4">
        <div class="col-lg-4">
          <section class="card h-100 text-center">
            <div class="card-body d-flex flex-column align-items-center justify-content-center">
              <div id="avatarActual" class="avatar-perfil avatar-grande">A1</div>
              <h2 id="nombrePerfil" class="mb-1"></h2>
              <p id="rolPerfil" class="texto-ayuda mb-1"></p>
              <p id="escuelaPerfil" class="texto-ayuda"></p>
              <button type="button" id="btnCambiarAvatar" class="btn btn-outline-primary">
                Cambiar avatar
              </button>
            </div>
          </section>
        </div>

        <div class="col-lg-8">
          <section class="card h-100">
            <div class="card-body">
              <h2 class="card-title">Datos personales</h2>
              <dl class="row mb-0">
                <dt class="col-sm-5">Identificación</dt>
                <dd id="identificacionPerfil" class="col-sm-7 text-break"></dd>

                <dt class="col-sm-5">Correo institucional</dt>
                <dd id="correoPerfil" class="col-sm-7 text-break"></dd>

                <dt class="col-sm-5">Correo personal</dt>
                <dd id="correoPersonalPerfil" class="col-sm-7 text-break"></dd>

                <dt class="col-sm-5">Celular</dt>
                <dd id="celularPerfil" class="col-sm-7 text-break"></dd>

                <dt class="col-sm-5">Fecha de nacimiento</dt>
                <dd id="fechaNacimientoPerfil" class="col-sm-7 text-break"></dd>

                <dt class="col-sm-5">Edad</dt>
                <dd id="edadPerfil" class="col-sm-7 text-break"></dd>

                <dt class="col-sm-5">Sexo</dt>
                <dd id="sexoPerfil" class="col-sm-7 text-break"></dd>
              </dl>
            </div>
          </section>
        </div>
      </div>

      <section id="seleccionAvatar" class="card mt-4 oculto">
        <div class="card-body">
          <form id="formImagenPerfil">
            <fieldset>
              <legend class="fs-5 fw-bold">Seleccionar avatar</legend>

              <!-- Opciones para seleccionar una imagen de perfil entre 10 avatares. -->
              <div class="avatar-opciones">
                  <label class="avatar-opcion">
                    <input type="radio" name="avatarUsuario" value="A1" checked>
                    <img src="../img/A1.png" alt="Avatar 1">
                  </label>

                  <label class="avatar-opcion">
                    <input type="radio" name="avatarUsuario" value="A2">
                    <img src="../img/A2.png" alt="Avatar 2">
                  </label>

                  <label class="avatar-opcion">
                    <input type="radio" name="avatarUsuario" value="A3">
                    <img src="../img/A3.png" alt="Avatar 3">
                  </label>

                  <label class="avatar-opcion">
                    <input type="radio" name="avatarUsuario" value="A4">
                    <img src="../img/A4.png" alt="Avatar 4">
                  </label>

                  <label class="avatar-opcion">
                    <input type="radio" name="avatarUsuario" value="A5">
                    <img src="../img/A5.png" alt="Avatar 5">
                  </label>

                  <label class="avatar-opcion">
                    <input type="radio" name="avatarUsuario" value="A6">
                    <img src="../img/A6.png" alt="Avatar 6">
                  </label>

                  <label class="avatar-opcion">
                    <input type="radio" name="avatarUsuario" value="A7">
                    <img src="../img/A7.png" alt="Avatar 7">
                  </label>

                  <label class="avatar-opcion">
                    <input type="radio" name="avatarUsuario" value="A8">
                    <img src="../img/A8.png" alt="Avatar 8">
                  </label>

                  <label class="avatar-opcion">
                    <input type="radio" name="avatarUsuario" value="A9">
                    <img src="../img/A9.png" alt="Avatar 9">
                  </label>

                  <label class="avatar-opcion">
                    <input type="radio" name="avatarUsuario" value="A10">
                    <img src="../img/A10.png" alt="Avatar 10">
                  </label>
              </div>
            </fieldset>

            <div class="d-grid gap-2 d-sm-flex mt-4">
              <button type="submit" class="btn btn-primary">Guardar</button>
              <button type="button" id="btnCancelarAvatar" class="btn btn-outline-primary">Cancelar</button>
            </div>
            <p id="mensajeImagenPerfil" class="mt-3 mb-0" role="status" aria-live="polite"></p>
          </form>
        </div>
      </section>
    </main>
  </div>

  <footer class="pie-pagina" id="piePagina"></footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
  <script src="../js/api.js"></script>
  <script src="../js/almacenamiento.js"></script>
  <script src="../js/componentes.js"></script>
  <script src="../js/menu.js"></script>
  <script src="../js/perfil.js"></script>
</body>
</html>
