<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Revisión | Sistema de Gestión Curricular</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
  <header class="encabezado" id="encabezado"></header>

  <div class="contenedor">
    <nav class="menu-lateral" id="menu"></nav>
    
    <main class="contenido">
      <h1>Cursos pendientes de revisión</h1>
      <p class="texto-ayuda">Bandeja de Desarrollo Curricular</p>

      <!-- Tabla de cursos pendientes de revisión. -->
      <div class="card shadow-sm">
        <div class="card-body">
          <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
              <thead class="table-light">
                <tr>
                  <th scope="col">Código</th>
                  <th scope="col">Nombre</th>
                  <th scope="col">Escuela</th>
                  <th scope="col">Enviado por</th>
                  <th scope="col">Fecha de envío</th>
                  <th scope="col">Acción</th>
                </tr>
              </thead>
              <tbody id="tablaRevision">
                <!-- JavaScript agregará aquí los cursos pendientes. -->
              </tbody>
            </table>
          </div>

          <!-- Mensaje para cuando no hay cursos pendientes. -->
          <p id="sinCursosRevision" class="texto-ayuda mt-3 mb-0">
            No hay cursos pendientes de revisión.
          </p>
        </div>
      </div>
    </main>

  </div>

  <footer class="pie-pagina" id="piePagina"></footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
  <script src="../js/api.js"></script>
  <script src="../js/almacenamiento.js"></script>
  <script src="../js/componentes.js"></script>
  <script src="../js/menu.js"></script>
</body>
</html>
