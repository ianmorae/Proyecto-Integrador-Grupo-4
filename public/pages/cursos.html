<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cursos | Sistema de Gestión Curricular</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
  <header class="encabezado" id="encabezado"></header>

  <div class="contenedor">
    <nav class="menu-lateral" id="menu"></nav>

    <main class="contenido">
      <h1>Cursos</h1>

      <!-- Muestra una descripción del catálogo de cursos. -->
      <p class="texto-ayuda">Catálogo general de cursos registrados</p>

      <!-- Formulario para buscar y filtrar los cursos registrados. -->
      <form id="formFiltros" class="card p-3 mb-4" novalidate autocomplete="off">

          <div class="row g-3">

              <div class="col-md-6 col-lg-4">
                  <label class="form-label" for="buscarCurso">Buscar</label>
                  <input type="search" class="form-control" id="buscarCurso" placeholder="Código, nombre, escuela…">
              </div>

              <div class="col-md-6 col-lg-4">
                  <label class="form-label" for="filtroEscuela">Escuela</label>
                  <select class="form-select" id="filtroEscuela">
                      <option value="">Todas</option>
                  </select>
              </div>

              <div class="col-md-6 col-lg-4">
                  <label class="form-label" for="filtroEstado">Estado</label>
                  <select class="form-select" id="filtroEstado">
                      <option value="">Todos</option>
                  </select>
              </div>

              <div class="col-md-6 col-lg-4">
                  <label class="form-label" for="filtroModalidad">Modalidad</label>
                  <select class="form-select" id="filtroModalidad">
                      <option value="">Todas</option>
                  </select>
              </div>

              <div class="col-md-6 col-lg-4">
                  <label class="form-label" for="filtroTematica">Temática</label>
                  <select class="form-select" id="filtroTematica">
                      <option value="">Todas</option>
                  </select>
              </div>

          </div>

          <div class="d-flex justify-content-end mt-3">
              <button type="button" id="btnRestablecer" class="btn btn-outline-primary">
                  Restablecer filtros
              </button>
          </div>

      </form>

      <!-- Muestra la cantidad de cursos registrados y anuncia los cambios a lectores de pantalla. -->
      <p id="totalCursos" class="texto-ayuda" role="status" aria-live="polite"></p>

      <!-- Contenedor que organiza la tabla de cursos. -->
      <div id="contenedorTabla" class="table-responsive">
          <table class="table table-hover align-middle">
              <thead>
                  <tr>
                      <th scope="col">Código</th>
                      <th scope="col">Nombre</th>
                      <th scope="col">Escuela</th>
                      <th scope="col">Temática</th>
                      <th scope="col">Nivel</th>
                      <th scope="col">Créditos</th>
                      <th scope="col">Modalidad</th>
                      <th scope="col">Moneda</th>
                      <th scope="col">Estado</th>
                  </tr>
              </thead>
              <tbody id="tablaCursos"></tbody>
          </table>
      </div>

      <!-- Mensaje que se muestra cuando todavía no hay cursos registrados. -->
      <p id="sinCursos" class="texto-ayuda oculto">Todavía no hay cursos registrados.</p>

    </main>
  </div>

  <footer class="pie-pagina" id="piePagina"></footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
  <script src="../js/almacenamiento.js"></script>
  <script src="../js/componentes.js"></script>
  <script src="../js/menu.js"></script>
  <script src="../js/cursos.js"></script>
</body>
</html>
