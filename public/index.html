<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar sesión | Sistema de Gestión Curricular</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <main class="container py-4">
    <div class="d-flex justify-content-end">
      <div class="btn-group btn-group-sm" role="group" aria-label="Idioma">
        <button type="button" class="btn btn-primary" aria-pressed="true">ES</button>
        <button type="button" class="btn btn-outline-primary" aria-pressed="false">EN</button>
      </div>
    </div>

    <div class="row justify-content-center">
      <div class="col-12 col-sm-10 col-md-7 col-lg-5">
        <section class="card mt-3">
          <div class="card-body p-4">
            <img src="img/logo.png" alt="Logo Universidad CENFOTEC" width="200" class="d-block mx-auto mb-3">
            <h1 class="text-center">Iniciar sesión</h1>
            <p class="texto-ayuda text-center">Sistema de Gestión de Cursos y Desarrollo Curricular</p>

            <button type="button" id="btnGoogle" class="btn btn-outline-primary w-100 mt-2">Continuar con Google</button>

            <p class="texto-ayuda text-center my-3">o</p>

            <form id="formLogin" novalidate autocomplete="off">
              <div class="mb-3">
                <label for="correoLogin" class="form-label">Correo institucional *</label>
                <input type="email" id="correoLogin" class="form-control" placeholder="usuario@ucenfotec.ac.cr" autocomplete="off" required>
                <small class="mensaje-error"></small>
              </div>

              <div class="mb-3">
                <label for="contrasenaLogin" class="form-label">Contraseña *</label>
                <input type="password" id="contrasenaLogin" class="form-control" autocomplete="new-password" required>
                <small class="mensaje-error"></small>
              </div>

              <button type="submit" class="btn btn-primary w-100">Ingresar</button>
            </form>

            <p id="mensajeLogin" class="mensaje-general error oculto" role="alert"></p>
          </div>
        </section>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
  <script src="js/api.js"></script>
  <script src="js/almacenamiento.js"></script>
  <script src="js/validaciones.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
