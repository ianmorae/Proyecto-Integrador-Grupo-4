<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar sesión | Sistema de Gestión Curricular</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <main class="pagina-login">
    <div class="idioma">
      <button type="button" class="idioma-activo">ES</button>
      <button type="button">EN</button>
    </div>

    <section class="tarjeta-login">
      <img src="img/logo.png" alt="Logo Universidad CENFOTEC">
      <h1>Iniciar sesión</h1>
      <p class="texto-ayuda">Sistema de Gestión de Cursos y Desarrollo Curricular</p>

      <button type="button" id="btnGoogle" class="btn btn-secundario btn-google">Continuar con Google</button>

      <p class="separador">o</p>

      <form id="formLogin" novalidate autocomplete="off">
        <div class="campo">
          <label for="correoLogin">Correo institucional *</label>
          <input type="email" id="correoLogin" placeholder="usuario@ucenfotec.ac.cr" autocomplete="off" required>
          <small class="mensaje-error"></small>
        </div>

        <div class="campo">
          <label for="contrasenaLogin">Contraseña *</label>
          <input type="password" id="contrasenaLogin" autocomplete="new-password" required>
          <small class="mensaje-error"></small>
        </div>

        <button type="submit" class="btn btn-primario">Ingresar</button>
      </form>

      <p id="mensajeLogin" class="mensaje-general error oculto"></p>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
  <script src="js/almacenamiento.js"></script>
  <script src="js/validaciones.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
