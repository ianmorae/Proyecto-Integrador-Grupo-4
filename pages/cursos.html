<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cursos | Sistema de Gestión Curricular</title>
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
  <header class="encabezado">
    <img src="../img/logo.png" alt="Logo Universidad CENFOTEC">
    <p class="nombre-sistema">Sistema de Gestión Curricular</p>
    <div class="idioma">
      <button type="button" class="idioma-activo">ES</button>
      <button type="button">EN</button>
    </div>
  </header>

  <div class="contenedor">
    <nav class="menu-lateral">
      <ul>
        <li><a href="inicio.html">Inicio</a></li>
        <li><a href="cursos.html" class="menu-activo">Cursos</a></li>
        <li><a href="curso-formulario.html">Nuevo curso</a></li>
        <li><a href="revision.html">Revisión</a></li>
        <li><a href="catalogos.html">Catálogos</a></li>
        <li><a href="usuarios.html">Usuarios</a></li>
        <li><span class="menu-deshabilitado">Reportes <small>(En construcción)</small></span></li>
        <li><a href="perfil.html">Mi perfil</a></li>
      </ul>
    </nav>

    <main class="contenido">
      <h1>Cursos</h1>

      <!-- Muestra una descripción del catálogo de cursos. -->
      <p class="texto-ayuda">Catálogo general de cursos registrados</p>

      <!-- Muestra la cantidad de cursos registrados y anuncia los cambios a lectores de pantalla. -->
      <p id="totalCursos" class="texto-ayuda" role="status" aria-live="polite"></p>

      <!-- Contenedor que organiza la tabla de cursos. -->
      <div id="contenedorTabla" class="tabla-contenedor">

        <!-- Tabla donde se muestran los cursos registrados. -->
        <table class="tabla">
          <thead>
            <tr>
              <!-- Encabezado de la columna del código del curso. -->
              <th scope="col">Código</th>

              <!-- Encabezado de la columna del nombre del curso. -->
              <th scope="col">Nombre</th>

              <!-- Encabezado de la columna de la escuela correspondiente. -->
              <th scope="col">Escuela</th>

              <!-- Encabezado de la columna de la modalidad del curso. -->
              <th scope="col">Modalidad</th>

              <!-- Encabezado de la columna del estado del curso. -->
              <th scope="col">Estado</th>
            </tr>
          </thead>

          <!-- Aquí JavaScript agrega las filas con la información de los cursos. -->
          <tbody id="tablaCursos"></tbody>
        </table>
      </div>

      <!-- Mensaje que se muestra cuando todavía no hay cursos registrados. -->
      <p id="sinCursos" class="texto-ayuda oculto">Todavía no hay cursos registrados.</p>

    </main>
  </div>

  <script src="../js/almacenamiento.js"></script>
  <script src="../js/menu.js"></script>
  <script src="../js/cursos.js"></script>
</body>
</html>
